<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>OtakuRoom — watch together</title>
<style>
:root{--bg:#08090d;--surface:#101219;--surface2:#151721;--surface3:#1b1e29;--line:#262a36;--text:#f6f7fb;--muted:#9298aa;--accent:#a879ff;--accent2:#ff5ca8;--good:#50e39c;--danger:#ff6878}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh}.desktop{display:grid;grid-template-columns:240px minmax(0,1fr) 340px}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:24px 15px;background:#0a0b10}.brand{font-size:21px;font-weight:900;margin:0 10px 30px}.brand i{font-style:normal;color:var(--accent2)}.nav{display:grid;gap:5px}.nav button{padding:12px 13px;background:transparent;color:var(--muted);text-align:left;border-radius:12px}.nav button.active,.nav button:hover{background:var(--surface2);color:#fff}.profileMini{position:absolute;left:15px;right:15px;bottom:18px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8d62ff,#ff5ca8);font-weight:900;flex:none}.main{min-width:0;padding:22px 26px 100px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;gap:10px;align-items:center;margin-bottom:24px}.search{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 15px;color:#fff;outline:none}.search:focus{border-color:#65479d}.btn{padding:11px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:11px}.btn.primary{background:linear-gradient(135deg,#9a68ff,#ed4f9e);border:0;font-weight:800}.hero{border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:300px;position:relative;background:linear-gradient(100deg,#171323,#0d1017 70%)}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 45%,#9b62ff28,transparent 35%);pointer-events:none}.heroContent{position:relative;z-index:2;padding:38px;max-width:680px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#d2baff;font-weight:900}.hero h1{font-size:40px;line-height:1.02;margin:9px 0}.hero p{color:#b4b8c6;max-width:580px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;padding:6px 9px;border-radius:999px;background:#ffffff0c;border:1px solid #ffffff12;color:#d4d7e0}.section{margin-top:28px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.sectionHead h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}.animeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0;transition:.18s transform,.18s border}.card:hover{transform:translateY(-2px);border-color:#3b4050}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#202333,#101117);overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.cardBody{padding:10px}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{height:100vh;position:sticky;top:0;border-left:1px solid var(--line);background:#0a0b10;display:flex;flex-direction:column}.rightHead{padding:20px;border-bottom:1px solid var(--line)}.chat{padding:15px;display:flex;flex-direction:column;gap:13px;overflow:auto;flex:1}.msg{display:flex;gap:8px}.bubble{background:var(--surface2);border:1px solid var(--line);padding:8px 10px;border-radius:5px 12px 12px 12px;font-size:13px}.bubble b{font-size:11px}.bubble p{margin:3px 0 0;color:#d9dbe2}.chatForm{padding:12px;border-top:1px solid var(--line);display:flex;gap:7px}.chatForm input{min-width:0;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;color:#fff}.bottom{display:none}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(680px,100%);background:#11131b;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 18px}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select{background:#191c26;color:#fff;border:1px solid var(--line);padding:12px;border-radius:10px}.close{float:right;background:#20232e;border-radius:9px;padding:7px 10px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;padding:8px 11px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:#b8bdca}.tab.active{background:#2b213c;color:#fff;border-color:#65479d}.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--good)}.empty{padding:25px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center}
@media(max-width:1050px){.desktop{grid-template-columns:76px minmax(0,1fr)}.side{padding:18px 9px}.brand{font-size:0;text-align:center}.brand i{font-size:22px}.nav button{font-size:0;text-align:center}.profileMini{display:none}.right{display:none}}
@media(max-width:700px){body{padding-bottom:72px}.desktop{display:block}.side{display:none}.main{padding:12px 12px 90px}.topbar{margin-bottom:15px}.topbar .btn{display:none}.topbar .btn.primary{display:block;font-size:0;padding:11px 13px}.topbar .btn.primary:after{content:"＋";font-size:18px}.hero{min-height:250px;border-radius:18px}.heroContent{padding:25px 21px}.hero h1{font-size:29px}.animeGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:13px}.bottom{position:fixed;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:68px;padding-bottom:env(safe-area-inset-bottom);background:#0d0e14eF;border-top:1px solid var(--line);backdrop-filter:blur(20px)}.bottom button{background:transparent;color:#858b9c;font-size:10px;display:grid;place-items:center}.bottom button b{font-size:19px}.bottom button.active{color:#fff}.modal{align-items:flex-end}.sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app desktop">
<aside class="side"><div class="brand">Otaku<i>Room</i></div><nav class="nav">
<button class="active" data-page="home">⌂　Главная</button><button data-page="catalog">◈　Каталог</button><button data-page="friends">♧　Друзья</button><button data-page="rooms">◉　Комнаты</button><button data-page="profile">◎　Профиль</button>
</nav><div class="profileMini"><div class="avatar">Я</div><div><b>Гость</b><div class="muted">Войти / создать аккаунт</div></div></div></aside>

<main class="main">
<div class="topbar"><input class="search" id="search" placeholder="Поиск аниме, жанра…"><button class="btn" id="loginBtn">Войти</button><button class="btn primary" id="roomBtn">Создать комнату</button></div>
<section id="content"></section>
</main>
<aside class="right"><div class="rightHead"><b>Комната</b><div class="muted">Сейчас ничего не запущено</div></div><div class="chat"><div class="empty">Здесь появится чат комнаты, когда ты войдёшь в совместный просмотр.</div></div><form class="chatForm"><input placeholder="Сообщение…" disabled><button class="btn" disabled>➤</button></form></aside>
</div>
<nav class="bottom"><button class="active" data-page="home"><b>⌂</b>Главная</button><button data-page="catalog"><b>◈</b>Каталог</button><button data-page="friends"><b>♧</b>Друзья</button><button data-page="rooms"><b>◉</b>Комнаты</button><button data-page="profile"><b>◎</b>Профиль</button></nav>

<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">✕</button><div id="modalContent"></div></div></div>

<script>
const content=document.getElementById('content'), modal=document.getElementById('modal'), modalContent=document.getElementById('modalContent');
const fallback=[
{title:'Solo Leveling Season 2',score:8.8,year:2025,genres:['Action','Fantasy'],img:'https://cdn.myanimelist.net/images/anime/1908/145275.jpg'},
{title:'The Apothecary Diaries 2nd Season',score:9.0,year:2025,genres:['Drama','Mystery'],img:'https://cdn.myanimelist.net/images/anime/1183/146178.jpg'},
{title:'Demon Slayer',score:8.5,year:2019,genres:['Action','Fantasy'],img:'https://cdn.myanimelist.net/images/anime/1286/99889.jpg'},
{title:'Jujutsu Kaisen',score:8.6,year:2020,genres:['Action','Supernatural'],img:'https://cdn.myanimelist.net/images/anime/1171/109222.jpg'},
{title:'Frieren',score:9.3,year:2023,genres:['Adventure','Fantasy'],img:'https://cdn.myanimelist.net/images/anime/1015/138006.jpg'},
{title:'Attack on Titan',score:9.1,year:2013,genres:['Action','Drama'],img:'https://cdn.myanimelist.net/images/anime/1000/110531.jpg'}
];
let catalog=fallback;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(a){return `<article class="card" onclick="openAnime('${esc(a.title).replaceAll("'","&#39;")}')"><div class="poster"><img loading="lazy" src="${a.img}" alt=""></div><div class="cardBody"><div class="title">${esc(a.title)}</div><div class="meta">★ ${a.score||'—'} · ${a.year||'—'}</div></div></article>`}
function home(){content.innerHTML=`<section class="hero"><div class="heroContent"><div class="eyebrow">Совместный просмотр</div><h1>Смотри аниме вместе.</h1><p>Создай приватную комнату, пригласи друга и смотрите синхронно. Профили, друзья, озвучки, жанры и персональные списки — всё в одном месте.</p><div class="chips"><span class="chip">Приватные комнаты</span><span class="chip">Синхронизация</span><span class="chip">Чат</span><span class="chip">Друзья</span></div><div style="margin-top:20px"><button class="btn primary" onclick="openRoom()">＋ Создать комнату</button></div></div></section><section class="section"><div class="sectionHead"><h2>Популярное сейчас</h2><span class="muted">обновляется из каталога</span></div><div class="animeGrid">${catalog.map(card).join('')}</div></section><section class="section"><div class="sectionHead"><h2>Жанры</h2></div><div class="tabs">${['Экшен','Приключения','Комедия','Драма','Фэнтези','Романтика','Мистика','Спорт'].map(x=>`<button class="tab" onclick="filterGenre('${x}')">${x}</button>`).join('')}</div></section>`}
function catalogPage(){content.innerHTML=`<section><div class="sectionHead"><h2>Каталог</h2><span class="muted" id="catalogStatus">загрузка…</span></div><div class="tabs">${['Все','Онгоинги','Популярные','Новинки'].map((x,i)=>`<button class="tab ${i===0?'active':''}">${x}</button>`).join('')}</div><div class="animeGrid" id="grid">${catalog.map(card).join('')}</div></section>`;loadJikan()}
async function loadJikan(){try{let r=await fetch('https://api.jikan.moe/v4/top/anime?filter=airing&limit=12');if(!r.ok)throw 0;let j=await r.json();catalog=j.data.map(x=>({title:x.title,score:x.score,year:x.year||x.aired?.from?.slice(0,4),genres:x.genres?.map(g=>g.name)||[],img:x.images?.jpg?.large_image_url||x.images?.jpg?.image_url}));document.getElementById('grid').innerHTML=catalog.map(card).join('');document.getElementById('catalogStatus').textContent='обновлено сейчас'}catch(e){document.getElementById('catalogStatus').textContent='демо-каталог · API недоступен'}}
function friends(){content.innerHTML=`<section><div class="sectionHead"><h2>Друзья</h2><button class="btn primary" onclick="openFriend()">＋ Добавить</button></div><div class="empty">Войди в аккаунт, чтобы добавлять друзей по нику или ссылке-приглашению.</div></section>`}
function rooms(){content.innerHTML=`<section><div class="sectionHead"><h2>Комнаты</h2><button class="btn primary" onclick="openRoom()">Создать</button></div><div class="empty">Приватные комнаты и приглашения появятся после подключения аккаунта.</div></section>`}
function profile(){content.innerHTML=`<section><div class="sectionHead"><h2>Профиль</h2></div><div class="hero" style="min-height:220px"><div class="heroContent"><div class="avatar" style="width:60px;height:60px;font-size:22px">Я</div><h1>Твой профиль</h1><p>Привяжи email, задай ник, аватар, список любимого и настройки приватности.</p><button class="btn primary" onclick="openAuth()">Войти / зарегистрироваться</button></div></div></section>`}
function render(p='home'){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));({home,catalog:catalogPage,friends,rooms,profile}[p]||home)()}
function openModal(html){modalContent.innerHTML=html;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()}
function openAuth(){openModal(`<h2>Аккаунт</h2><div class="tabs"><button class="tab active">Email</button><button class="tab">Google</button></div><div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input type="password" placeholder="Минимум 8 символов"></div><button class="btn primary" style="width:100%" onclick="toast('Supabase Auth подключим на следующем шаге')">Создать аккаунт</button><p class="muted">После подключения Supabase здесь будут регистрация, подтверждение email, вход и восстановление пароля.</p>`)}
function openRoom(){openModal(`<h2>Новая комната</h2><div class="field"><label>Название</label><input value="Вечерний просмотр"></div><div class="field"><label>Приватность</label><select><option>Приватная — только по приглашению</option><option>По ссылке</option><option>Публичная</option></select></div><div class="field"><label>Кто может управлять плеером</label><select><option>Только создатель</option><option>Все участники</option></select></div><button class="btn primary" style="width:100%" onclick="toast('Комната будет создана после подключения базы');closeModal()">Создать комнату</button>`)}
function openFriend(){openModal(`<h2>Добавить друга</h2><div class="field"><label>Ник или ссылка профиля</label><input placeholder="@username"></div><button class="btn primary" style="width:100%" onclick="toast('Заявка будет отправлена через Supabase');closeModal()">Отправить заявку</button>`)}
function openAnime(t){openModal(`<h2>${esc(t)}</h2><p class="muted">Сезоны · эпизоды · жанры · рейтинги · описание</p><div class="field"><label>Озвучка</label><select><option>Оригинал + субтитры</option><option>Русская озвучка</option><option>Японская озвучка</option></select></div><button class="btn primary" style="width:100%" onclick="openRoom()">Смотреть вместе</button>`)}
function filterGenre(g){toast('Фильтр: '+g)}
function toast(s){let x=document.createElement('div');x.textContent=s;x.style.cssText='position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#f4f5f8;color:#111;padding:10px 14px;border-radius:10px;font-weight:700;z-index:99';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));
document.getElementById('loginBtn').onclick=openAuth;document.getElementById('roomBtn').onclick=openRoom;
document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();let f=catalog.filter(a=>a.title.toLowerCase().includes(q)||a.genres.join(' ').toLowerCase().includes(q));let g=document.getElementById('grid');if(g)g.innerHTML=f.map(card).join('')||'<div class="empty">Ничего не найдено</div>'};
render();
</script>
</body></html>
